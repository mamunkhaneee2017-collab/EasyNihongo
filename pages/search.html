<html lang="en">

<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Search | Easy Nihongo</title>

<link rel="icon" type="image/jpeg" href="../assets/icons/logo.jpeg">
<link rel="manifest" href="../manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body data-page="search">

<a class="skip-link" href="#main-content">Skip to content</a>

<div id="site-header"></div>
<script src="../components/header.js"></script>

<main id="main-content">

<section class="search-hero">
    <div class="container">
        <span class="hero-eyebrow">検索 &middot; Search</span>
        <h1>Search Easy Nihongo</h1>
        <div class="search-hero-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="siteSearchInput" placeholder="Search a word, kanji, grammar pattern, or hiragana/katakana...">
        </div>
        <p class="search-results-summary" id="searchResultsSummary"></p>
    </div>
</section>

<section class="search-results-section">
    <div class="container">
        <div id="searchResults">
            <!-- Result groups injected by js/pages/search.js -->
        </div>
    </div>
</section>

</main>

<div id="site-footer"></div>
<script src="../components/footer.js"></script>

<script src="../data/content-helpers.js"></script>
<script src="../data/hiragana-data.js"></script>
<script src="../data/katakana-data.js"></script>

<script src="../data/kanji/kanji-data.js"></script>
<script src="../data/courses/courses-data.js"></script>
<script src="../js/pages/search.js"></script>
<script src="../locales/en.js"></script>
<script src="../locales/bn.js"></script>
<script src="../locales/ja.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/utils.js"></script>

</body>

</html>
