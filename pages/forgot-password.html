<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Easy Nihongo</title>

    <link rel="icon" type="image/jpeg" href="../assets/icons/logo.jpeg">
    <link rel="manifest" href="../manifest.json">

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/variables.css">

    <link rel="stylesheet"
          href="../css/reset.css">

    <link rel="stylesheet"
          href="../css/base.css">

    <link rel="stylesheet"
          href="../css/pages/login.css">

    <link rel="stylesheet" href="../css/navbar.css">

    <link rel="stylesheet" href="../css/footer.css">

    <!-- Always Last -->
    <link rel="stylesheet" href="../css/dark.css">

</head>

<body data-page="login">

<a class="skip-link" href="#main-content">Skip to content</a>

<div id="site-header"></div>
<script src="../components/header.js"></script>

<main id="main-content">

<section class="login">

<div class="login-container">

<div class="login-left">
<h1 data-i18n="forgotPassword.title">Forgot Your Password? 🔑</h1>

<p data-i18n="forgotPassword.subtitle">

No problem. Enter the email you used to register, and we'll send you a link to reset your password.

</p>

<img src="../assets/images/login/login.png"
     alt="Illustration of a person resetting a password">

</div>

<div class="login-right">
<form id="forgotPasswordForm">

<h2 data-i18n="forgotPassword.formTitle">Reset Password</h2>

<div class="input-group">

<label for="email" data-i18n="login.label.email">Email</label>

<input
type="email"
id="email"
placeholder="Enter your account email"
data-i18n-placeholder="forgotPassword.placeholder.email"
required>

</div>

<button
    type="submit"
    class="login-btn"
    id="resetBtn">

    <i class="fa-solid fa-paper-plane"></i>

    <span data-i18n="forgotPassword.submitBtn">Send Reset Link</span>

</button>

<p class="form-status" id="formStatus" role="status"></p>

<p class="register-link">

<span data-i18n="forgotPassword.remembered">Remembered your password?</span>

<a href="login.html" data-i18n="login.submitBtn">

Login

</a>

</p>

</form>

</div>

</div>

</section>

</main>

<div id="site-footer"></div>
<script src="../components/footer.js"></script>

<script src="../js/pages/forgot-password.js"></script>
<script src="../locales/en.js"></script>
<script src="../locales/bn.js"></script>
<script src="../locales/ja.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/utils.js"></script>

</body>

</html>
