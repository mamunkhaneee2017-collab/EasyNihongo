<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Easy Nihongo</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="icon" type="image/jpeg" href="../assets/icons/logo.jpeg">
    <link rel="manifest" href="../manifest.json">

    <link rel="stylesheet" href="../css/variables.css">

    <link rel="stylesheet"
          href="../css/reset.css">

    <link rel="stylesheet"
          href="../css/base.css">

    <link rel="stylesheet" href="../css/torn-accent.css">

    <link rel="stylesheet"
          href="../css/pages/login.css">

    <link rel="stylesheet" href="../css/navbar.css">

    <link rel="stylesheet" href="../css/footer.css">

    <!-- Always Last -->
    <link rel="stylesheet" href="../css/dark.css">

</head>

<body data-page="login">

<a class="skip-link" href="#main-content">Skip to content</a>

<div id="site-header"></div>
<script src="../components/header.js"></script>

<main id="main-content">

<section class="login">

<div class="login-container">

<div class="login-left torn-diagonal torn-diagonal--panel">
<h1 data-i18n="login.welcome">Welcome Back 👋</h1>

<p data-i18n="login.subtitle">

Login to continue your Japanese learning journey.

</p>

</div>

<div class="login-right">
<form id="loginForm">

<h2 data-i18n="login.formTitle">Login</h2>

<div class="input-group">

<label data-i18n="login.label.email">Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
data-i18n-placeholder="login.placeholder.email"
required>

</div>

<div class="input-group">

<label data-i18n="login.label.password">Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Password"
data-i18n-placeholder="login.label.password"
required>

<i
class="fa-solid fa-eye"
id="togglePassword">

</i>

</div>

</div>

<div class="remember">

<label>

<input
type="checkbox"
id="rememberMe">

<span data-i18n="login.rememberMe">Remember Me</span>

</label>

<a href="forgot-password.html"
class="forgot-link" data-i18n="login.forgotPassword">

Forgot Password?

</a>

</div>

<button
    type="submit"
    class="login-btn"
    id="loginBtn">

    <i class="fa-solid fa-right-to-bracket"></i>

    <span data-i18n="login.submitBtn">Login</span>

</button>

<!-- Divider -->

<div class="divider">

    <span data-i18n="register.or">OR</span>

</div>

<!-- Social Login -->

<div class="social-login">

    <button
        type="button"
        class="google-btn">

        <i class="fa-brands fa-google"></i>

        <span data-i18n="register.google">Continue with Google</span>

    </button>

    <button
        type="button"
        class="github-btn">

        <i class="fa-brands fa-github"></i>

        <span data-i18n="register.github">Continue with GitHub</span>

    </button>

</div>

<p class="register-link">

<span data-i18n="login.noAccount">Don't have an account?</span>

<a href="register.html" data-i18n="login.registerHere">

Register

</a>

</p>

</form>

</div>

</div>

</section>

</main>

<div id="site-footer"></div>
<script src="../components/footer.js"></script>

<script src="../js/pages/login.js"></script>

<script src="../locales/en.js"></script>
<script src="../locales/bn.js"></script>
<script src="../locales/ja.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/utils.js"></script>

</body>

</html>
