services:
  - type: web
    name: easynihongo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SEED_EMAIL
        value: admin@easynihongo.com
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Email backup of every contact-form inquiry (see backend/lib/notify.js).
      # The free plan has no persistent disk, so this is the permanent copy.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
